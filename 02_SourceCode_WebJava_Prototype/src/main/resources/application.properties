# Cong dich vu
server.port=8080

# Ket noi CSDL MySQL tren XAMPP (Cong 3306)
spring.datasource.url=jdbc:mysql://localhost:3306/quanly_cafe?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cau hinh JPA / Hibernate ORM
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cau hinh phuc vu Static Web (HTML5/Bootstrap 5 trong static/)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Cau hinh UTF-8 tieng Viet
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Cau hinh Jackson JSON tranh loi Infinite Recursion khi serialize Entity
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
