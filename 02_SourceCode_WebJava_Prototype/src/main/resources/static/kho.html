<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kho nguyên liệu &amp; KPI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/mossary.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar-root"></div>

    <div class="flex-grow-1 d-flex flex-column min-w-0">
      <div id="app-topbar-root"></div>

      <main class="p-3 p-sm-4 mx-auto w-100 d-flex flex-column gap-4" style="max-width:1440px;">
        <!-- 4-Column KPI Strip with RBAC Masking -->
        <section id="kpi-strip" class="row g-3"></section>

        <!-- Low Stock Alert Banner -->
        <div id="low-stock-banner" class="d-none"></div>

        <!-- Feedback & Error Alerts -->
        <div id="kho-feedback" class="alert alert-success py-2 px-3 mb-0 rounded-3 d-none d-flex align-items-center justify-content-between" style="font-size:0.82rem;"></div>
        <div id="kho-error" class="alert alert-warning py-2 px-3 mb-0 rounded-3 d-none d-flex align-items-center justify-content-between" style="font-size:0.82rem;"></div>

        <!-- Main Inventory Table -->
        <section class="moss-card p-3 p-sm-4">
          <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3 mb-3">
            <div>
              <h2 class="font-display fw-semibold mb-1" style="font-size:1.125rem;">Tồn kho nguyên liệu pha chế</h2>
              <p id="inventory-role-desc" class="mb-0" style="font-size:0.78rem;color:var(--text-secondary);"></p>
            </div>
            <div class="d-flex flex-wrap align-items-center gap-2">
              <button id="btn-filter-low" type="button" class="btn btn-sm rounded-3 border fw-semibold" style="height:36px;font-size:0.78rem;background:var(--bg-surface-hover);border-color:var(--border-strong) !important;">
                Chỉ xem sắp hết hàng (<span id="low-filter-count">0</span>)
              </button>
              <span id="add-ing-btn-wrap"></span>
            </div>
          </div>

          <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-3">
            <div id="ing-cat-tabs" class="moss-tabs"></div>
            <div class="position-relative" style="min-width:240px;">
              <i class="bi bi-search position-absolute top-50 translate-middle-y ms-3" style="color:var(--text-muted);"></i>
              <input id="ing-search" type="search" class="form-control moss-input ps-5" placeholder="Tìm tên nguyên liệu..." style="height:40px;" />
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-moss mb-0" style="font-size:0.85rem;">
              <thead>
                <tr style="font-size:0.75rem;color:var(--text-secondary);">
                  <th>Nguyên liệu</th>
                  <th>Danh mục</th>
                  <th class="text-end">Tồn kho hiện tại</th>
                  <th class="text-end">Ngưỡng cảnh báo</th>
                  <th>Tình trạng</th>
                  <th class="text-end">Đơn giá nhập</th>
                  <th class="text-end">Thao tác</th>
                </tr>
              </thead>
              <tbody id="ingredients-tbody"></tbody>
            </table>
          </div>
        </section>

        <!-- Bottom 2-Column Analytics -->
        <div class="row g-4">
          <div class="col-lg-6">
            <section class="moss-card p-3 p-sm-4 h-100">
              <h2 class="font-display fw-semibold mb-3" style="font-size:1.125rem;">Hiệu suất món bán chạy</h2>
              <div id="top-selling-list" class="d-flex flex-column gap-3"></div>
            </section>
          </div>
          <div class="col-lg-6">
            <section class="moss-card p-3 p-sm-4 h-100">
              <h2 class="font-display fw-semibold mb-3" style="font-size:1.125rem;">Nhật ký xuất kho tự động từ POS</h2>
              <div id="deduction-log-list" class="d-flex flex-column gap-2" style="max-height:300px;overflow-y:auto;"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Restock Modal -->
  <div class="modal fade" id="restockModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <form id="restock-form" class="modal-content">
        <div class="modal-body p-4 d-flex flex-column gap-3">
          <div class="d-flex align-items-center justify-content-between">
            <h3 id="restock-modal-title" class="font-display fw-bold mb-0" style="font-size:1rem;">Nhập kho</h3>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
          </div>
          <div id="restock-modal-info" class="font-mono tabular-nums" style="font-size:0.75rem;color:var(--text-secondary);"></div>
          <div>
            <label for="restock-amount" class="form-label fw-semibold" style="font-size:0.78rem;">Số lượng nhập thêm</label>
            <input id="restock-amount" type="number" min="1" step="any" value="500" required class="form-control moss-input font-mono tabular-nums" />
          </div>
          <div class="d-flex gap-2">
            <button type="button" data-preset="100" class="btn btn-sm btn-light border flex-fill font-mono preset-btn">+100</button>
            <button type="button" data-preset="500" class="btn btn-sm btn-light border flex-fill font-mono preset-btn">+500</button>
            <button type="button" data-preset="1000" class="btn btn-sm btn-light border flex-fill font-mono preset-btn">+1000</button>
          </div>
          <div class="d-flex gap-2 pt-1">
            <button type="button" class="btn btn-outline-secondary flex-fill rounded-3" data-bs-dismiss="modal" style="font-size:0.8rem;">Hủy</button>
            <button id="btn-restock-save" type="submit" class="btn btn-forest flex-fill" style="font-size:0.8rem;">Xác nhận nhập</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Ingredient Modal -->
  <div class="modal fade" id="addIngModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form id="add-ing-form" class="modal-content">
        <div class="modal-body p-4 d-flex flex-column gap-3">
          <div class="d-flex align-items-center justify-content-between">
            <h3 class="font-display fw-bold mb-0" style="font-size:1.05rem;">Thêm nguyên liệu mới</h3>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
          </div>
          <div class="row g-2">
            <div class="col-12">
              <label class="form-label fw-semibold" style="font-size:0.78rem;">Tên nguyên liệu</label>
              <input id="new-ing-name" type="text" required placeholder="Vd: Hạt sen tươi, Siro bạc hà..." class="form-control moss-input" />
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold" style="font-size:0.78rem;">Đơn vị tính</label>
              <input id="new-ing-unit" type="text" required value="ml" placeholder="ml / g / cái" class="form-control moss-input" />
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold" style="font-size:0.78rem;">Đơn giá nhập (VNĐ)</label>
              <input id="new-ing-cost" type="number" min="0" value="50" class="form-control moss-input font-mono tabular-nums" />
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold" style="font-size:0.78rem;">Tồn kho ban đầu</label>
              <input id="new-ing-stock" type="number" min="0" step="any" required value="500" class="form-control moss-input font-mono tabular-nums" />
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold" style="font-size:0.78rem;">Ngưỡng cảnh báo</label>
              <input id="new-ing-threshold" type="number" min="0" step="any" required value="100" class="form-control moss-input font-mono tabular-nums" />
            </div>
          </div>
          <div class="d-flex gap-2 pt-2">
            <button type="button" class="btn btn-outline-secondary flex-fill rounded-3" data-bs-dismiss="modal" style="font-size:0.8rem;">Hủy</button>
            <button id="btn-add-ing-save" type="submit" class="btn btn-forest flex-fill" style="font-size:0.8rem;">Lưu nguyên liệu</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dung-chung.js"></script>
  <script src="js/kho-page.js"></script>
</body>
</html>
