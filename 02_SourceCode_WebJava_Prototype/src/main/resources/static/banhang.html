<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bán hàng (POS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/mossary.css" rel="stylesheet" />
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar-root"></div>

    <div class="flex-grow-1 d-flex flex-column min-w-0">
      <div id="app-topbar-root"></div>

      <main class="p-3 p-sm-4 mx-auto w-100" style="max-width:1440px;">
        <div class="row g-4 align-items-start">
          <!-- Left 8 Columns: Tables + Menu -->
          <div class="col-xl-8 d-flex flex-column gap-4">
            <!-- Tables & Takeaway -->
            <section class="moss-card p-3 p-sm-4">
              <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                <div>
                  <h2 class="font-display fw-semibold mb-1" style="font-size:1.125rem;">Sơ đồ bàn &amp; Mang đi</h2>
                  <p class="mb-0" style="font-size:0.78rem;color:var(--text-secondary);">
                    Đang phục vụ: <strong id="selected-table-label" class="text-dark">Bàn 02</strong>
                  </p>
                </div>
                <div id="area-tabs" class="moss-tabs"></div>
              </div>
              <div id="tables-grid" class="row g-2"></div>
            </section>

            <!-- Menu Catalog -->
            <section class="moss-card p-3 p-sm-4">
              <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-4">
                <div id="category-tabs" class="moss-tabs"></div>
                <div class="position-relative" style="min-width:240px;">
                  <i class="bi bi-search position-absolute top-50 translate-middle-y ms-3" style="color:var(--text-muted);"></i>
                  <input id="menu-search" type="search" class="form-control moss-input ps-5" placeholder="Tìm đồ uống..." style="height:40px;" />
                </div>
              </div>
              <div id="menu-grid" class="row g-3"></div>
            </section>
          </div>

          <!-- Right 4 Columns: Sticky Thermal Order Ticket -->
          <aside class="col-xl-4">
            <div class="pos-ticket">
              <div class="d-flex align-items-center justify-content-between pb-3 dashed-divider-bottom">
                <div class="d-flex align-items-center gap-3">
                  <span class="d-inline-flex align-items-center justify-content-center rounded-3" style="width:38px;height:38px;background-color:var(--bg-surface-muted);color:var(--accent-primary);">
                    <i class="bi bi-receipt-cutoff fs-5"></i>
                  </span>
                  <div>
                    <h2 id="ticket-title" class="font-display fw-semibold mb-0" style="font-size:1rem;">Phiếu gọi món</h2>
                    <div id="ticket-subtitle" style="font-size:0.75rem;color:var(--text-secondary);">Tại bàn</div>
                  </div>
                </div>
                <button id="btn-clear-cart" type="button" class="btn btn-sm text-danger fw-medium d-none">
                  <i class="bi bi-trash3 me-1"></i>Xóa
                </button>
              </div>

              <div id="cart-items-container" class="py-3" style="min-height:200px;max-height:350px;overflow-y:auto;"></div>

              <div class="pt-3 dashed-divider-top d-flex flex-column gap-3">
                <div>
                  <div class="fw-semibold mb-2" style="font-size:0.75rem;color:var(--text-secondary);">Phương thức thanh toán</div>
                  <div class="row g-2" id="payment-methods">
                    <div class="col-4">
                      <button type="button" data-pay="TIEN_MAT" class="btn w-100 py-2 border rounded-3 d-flex flex-column align-items-center gap-1 pay-method-btn btn-forest" style="font-size:0.75rem;">
                        <i class="bi bi-cash-stack"></i><span>Tiền mặt</span>
                      </button>
                    </div>
                    <div class="col-4">
                      <button type="button" data-pay="CHUYEN_KHOAN" class="btn w-100 py-2 border rounded-3 d-flex flex-column align-items-center gap-1 pay-method-btn bg-light" style="font-size:0.75rem;">
                        <i class="bi bi-qr-code-scan"></i><span>QR Pay</span>
                      </button>
                    </div>
                    <div class="col-4">
                      <button type="button" data-pay="THE" class="btn w-100 py-2 border rounded-3 d-flex flex-column align-items-center gap-1 pay-method-btn bg-light" style="font-size:0.75rem;">
                        <i class="bi bi-credit-card"></i><span>Thẻ</span>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="d-flex align-items-center justify-content-between gap-2">
                  <label for="pos-discount" class="fw-medium mb-0 d-flex align-items-center gap-1" style="font-size:0.78rem;color:var(--text-secondary);">
                    <i id="discount-lock-icon" class="bi bi-lock-fill text-warning d-none"></i>
                    <span>Giảm giá (VNĐ)</span>
                  </label>
                  <div id="discount-control-wrap"></div>
                </div>

                <div class="pt-2 border-top d-flex flex-column gap-1" style="border-color:var(--border-subtle) !important;">
                  <div class="d-flex justify-content-between" style="font-size:0.78rem;color:var(--text-secondary);">
                    <span>Tạm tính</span>
                    <span id="ticket-subtotal" class="font-mono tabular-nums">0 ₫</span>
                  </div>
                  <div id="ticket-discount-row" class="d-flex justify-content-between text-success d-none" style="font-size:0.78rem;">
                    <span>Giảm giá</span>
                    <span id="ticket-discount" class="font-mono tabular-nums">-0 ₫</span>
                  </div>
                  <div class="d-flex justify-content-between align-items-baseline pt-2">
                    <span class="fw-semibold" style="font-size:0.9rem;">Tổng thanh toán</span>
                    <span id="ticket-total" class="font-display fw-bold tabular-nums" style="font-size:1.5rem;">0 ₫</span>
                  </div>
                </div>

                <div id="pos-error" class="alert alert-danger py-2 px-3 mb-0 rounded-3 d-none" style="font-size:0.78rem;"></div>

                <button id="btn-checkout" type="button" class="btn btn-moss w-100" style="height:48px;font-size:0.9rem;" disabled>
                  Thanh toán
                </button>
              </div>
            </div>
          </aside>
        </div>

        <!-- Recent Paid Orders -->
        <section class="moss-card p-3 p-sm-4 mt-4">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h2 class="font-display fw-semibold mb-0" style="font-size:1.125rem;">Lịch sử hóa đơn hôm nay</h2>
            <span id="orders-count-label" class="tabular-nums" style="font-size:0.78rem;color:var(--text-secondary);">0 đơn</span>
          </div>
          <div class="table-responsive">
            <table class="table table-moss mb-0" style="font-size:0.85rem;">
              <thead>
                <tr style="font-size:0.75rem;color:var(--text-secondary);">
                  <th>Mã HĐ</th>
                  <th>Vị trí</th>
                  <th>Chi tiết món</th>
                  <th>Thanh toán</th>
                  <th>Thu ngân</th>
                  <th>Thời gian</th>
                  <th class="text-end">Tổng tiền</th>
                </tr>
              </thead>
              <tbody id="recent-orders-tbody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Receipt Modal -->
  <div class="modal fade" id="receiptModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-2">
        <div class="modal-body p-4">
          <div class="d-flex align-items-start gap-3 mb-3">
            <span class="d-inline-flex align-items-center justify-content-center rounded-circle text-success flex-shrink-0" style="width:42px;height:42px;background:rgba(21,128,61,0.12);">
              <i class="bi bi-check-circle-fill fs-5"></i>
            </span>
            <div>
              <h3 id="receipt-title" class="font-display fw-bold mb-1" style="font-size:1.1rem;">Thanh toán hoàn tất</h3>
              <p id="receipt-meta" class="mb-0" style="font-size:0.78rem;color:var(--text-secondary);"></p>
            </div>
          </div>
          <div id="receipt-deductions" class="border-top border-bottom py-3 my-3 d-flex flex-column gap-2" style="border-color:var(--border-strong) !important;"></div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary flex-fill rounded-3" data-bs-dismiss="modal" style="height:42px;font-size:0.8rem;">Tiếp tục bán hàng</button>
            <a href="kho.html" class="btn btn-forest flex-fill d-flex align-items-center justify-content-center gap-2" style="height:42px;font-size:0.8rem;">
              <span>Kiểm tra kho</span><i class="bi bi-arrow-right"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pos-page.js"></script>
</body>
</html>
