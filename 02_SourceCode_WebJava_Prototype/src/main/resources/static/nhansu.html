<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân Sự & Chấm Công - Coffee Management</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function() {
            try {
                const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
                if (!user) {
                    location.href = 'index.html';
                } else if (user.vaiTro === 'STAFF') {
                    alert('Tài khoản nhân viên không có quyền truy cập trang Quản lý Nhân sự!');
                    location.href = 'banhang.html';
                }
            } catch (e) {
                location.href = 'index.html';
            }
        })();
    </script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-cafe shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="nhansu.html">COFFEE POS</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="banhang.html">Bán Hàng (POS)</a></li>
                    <li class="nav-item"><a class="nav-link" href="kho.html">Quản Lý Kho & KPI</a></li>
                    <li class="nav-item"><a class="nav-link active" href="nhansu.html">Nhân Sự & Chấm Công</a></li>
                </ul>
                <div class="d-flex align-items-center text-white">
                    <span class="me-3 fw-semibold">Quản lý nhân sự</span>
                    <button type="button" id="logoutBtn" class="btn btn-outline-light btn-sm" onclick="thucHienDangXuat()">Thoát</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        
        <!-- Khối Chấm Công Nhanh -->
        <div class="card shadow-sm mb-4 border-warning">
            <div class="card-header bg-warning bg-opacity-25 d-flex justify-content-between align-items-center py-3">
                <span class="fw-bold fs-5 text-dark">CHẤM CÔNG CA LÀM VIỆC NHANH</span>
                <span class="badge bg-dark" id="liveClock">00:00:00</span>
            </div>
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Chọn nhân viên chấm công:</label>
                        <select id="chamCongMaNV" class="form-select">
                            <!-- Nạp động -->
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Chọn ca làm việc hôm nay:</label>
                        <select id="chamCongMaCa" class="form-select">
                            <!-- Nạp động -->
                        </select>
                    </div>
                    <div class="col-md-4 d-flex gap-2">
                        <button class="btn btn-success fw-bold flex-grow-1" onclick="thucHienCheckIn()">
                            Check-in Vào Ca
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            
            <!-- Cột trái: Quản lý nhân viên (7 cols) -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <span class="fw-bold">HỒ SƠ NHÂN VIÊN</span>
                        <button class="btn btn-primary btn-sm fw-semibold" onclick="moModalThemNV()">
                            Thêm Nhân Viên
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Mã</th>
                                        <th>Họ Tên</th>
                                        <th>Tài Khoản</th>
                                        <th>Vai Trò</th>
                                        <th>Trạng Thái</th>
                                        <th class="text-center">Thao Tác</th>
                                    </tr>
                                </thead>
                                <tbody id="employeeTableBody">
                                    <!-- Nạp động -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Lịch sử chấm công (5 cols) -->
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <span class="fw-bold">LỊCH SỬ CHẤM CÔNG</span>
                        <button class="btn btn-outline-secondary btn-sm" onclick="loadLichSuChamCong()">
                            Làm mới
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                            <table class="table table-sm table-hover align-middle mb-0 small">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nhân Viên</th>
                                        <th>Ca</th>
                                        <th>Check-in</th>
                                        <th>Trạng Thái</th>
                                        <th>Check-out</th>
                                    </tr>
                                </thead>
                                <tbody id="attendanceTableBody">
                                    <!-- Nạp động -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Modal Thêm Nhân Viên -->
    <div class="modal fade" id="modalThemNV" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Thêm Mới Hồ Sơ Nhân Viên</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Họ và tên:</label>
                        <input type="text" id="nvHoTen" class="form-control" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Số điện thoại:</label>
                        <input type="text" id="nvSDT" class="form-control" placeholder="0901234567">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên đăng nhập:</label>
                        <input type="text" id="nvUser" class="form-control" placeholder="staff_moi" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu:</label>
                        <input type="password" id="nvPass" class="form-control" value="123456" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Vai trò:</label>
                        <select id="nvVaiTro" class="form-select">
                            <option value="STAFF">STAFF (Nhân viên)</option>
                            <option value="MANAGER">MANAGER (Quản lý)</option>
                            <option value="ADMIN">ADMIN (Quản trị viên)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-primary fw-bold" onclick="luuNhanVien()">
                        Lưu Nhân Viên
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalThemNVInstance = null;
        let nhanVienList = [];
        let caLamList = [];

        document.addEventListener('DOMContentLoaded', () => {
            modalThemNVInstance = new bootstrap.Modal(document.getElementById('modalThemNV'));
            setInterval(updateClock, 1000);
            updateClock();
            loadNhanVien();
            loadCaLam();
            loadLichSuChamCong();
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleTimeString('vi-VN');
        }

        async function loadNhanVien() {
            try {
                const res = await fetch('/api/nhan-su/nhan-vien');
                nhanVienList = await res.json();
                renderNhanVien();
                populateSelectNV();
            } catch (e) {
                console.error("Lỗi tải nhân viên", e);
            }
        }

        function renderNhanVien() {
            const tbody = document.getElementById('employeeTableBody');
            tbody.innerHTML = '';
            nhanVienList.forEach(nv => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold">${nv.maNV}</td>
                    <td class="fw-semibold">${nv.hoTen}</td>
                    <td><code>${nv.tenDangNhap}</code></td>
                    <td><span class="badge ${nv.vaiTro === 'ADMIN' ? 'bg-danger' : nv.vaiTro === 'MANAGER' ? 'bg-warning text-dark' : 'bg-info text-dark'}">${nv.vaiTro}</span></td>
                    <td><span class="badge bg-success">Đang làm</span></td>
                    <td class="text-center">
                        <button class="btn btn-outline-danger btn-sm" onclick="xoaNhanVien(${nv.maNV})">
                            Xóa
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function populateSelectNV() {
            const sel = document.getElementById('chamCongMaNV');
            sel.innerHTML = '';
            nhanVienList.forEach(nv => {
                sel.innerHTML += `<option value="${nv.maNV}">${nv.hoTen} (${nv.vaiTro})</option>`;
            });
        }

        async function loadCaLam() {
            try {
                const res = await fetch('/api/nhan-su/ca-lam');
                caLamList = await res.json();
                const sel = document.getElementById('chamCongMaCa');
                sel.innerHTML = '';
                caLamList.forEach(cl => {
                    sel.innerHTML += `<option value="${cl.maCa}">${cl.tenCa} (${cl.gioBatDau} - ${cl.gioKetThuc})</option>`;
                });
            } catch (e) {
                console.error("Lỗi tải ca làm", e);
            }
        }

        async function loadLichSuChamCong() {
            try {
                const res = await fetch('/api/cham-cong/lich-su');
                const list = await res.json();
                const tbody = document.getElementById('attendanceTableBody');
                tbody.innerHTML = '';
                list.reverse().forEach(cc => {
                    const isLate = cc.trangThai === 'DI_TRE';
                    const checkInTime = cc.gioCheckIn ? cc.gioCheckIn.substring(11, 16) : '-';
                    const checkOutTime = cc.gioCheckOut ? cc.gioCheckOut.substring(11, 16) : null;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="fw-semibold">${cc.nhanVien.hoTen}</td>
                        <td>${cc.caLam.tenCa}</td>
                        <td>${checkInTime}</td>
                        <td><span class="badge ${isLate ? 'bg-danger' : 'bg-success'}">${isLate ? 'Đi trễ' : 'Đúng giờ'}</span></td>
                        <td>
                            ${checkOutTime 
                                ? `<span class="text-success fw-bold">${checkOutTime}</span>` 
                                : `<button class="btn btn-outline-primary btn-sm py-0" onclick="thucHienCheckOut(${cc.maChamCong})">Check-out</button>`}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("Lỗi tải chấm công", e);
            }
        }

        async function thucHienCheckIn() {
            const maNV = parseInt(document.getElementById('chamCongMaNV').value);
            const maCa = parseInt(document.getElementById('chamCongMaCa').value);

            try {
                const res = await fetch('/api/cham-cong/check-in', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maNV, maCa })
                });

                if (res.ok) {
                    const data = await res.json();
                    showToast(`Check-in thành công! Trạng thái: ${data.trangThai === 'DUNG_GIO' ? 'ĐÚNG GIỜ' : 'ĐI TRỄ'}`, true);
                    loadLichSuChamCong();
                } else {
                    showToast("Lỗi check-in!", false);
                }
            } catch (e) {
                showToast("Lỗi kết nối máy chủ backend!", false);
            }
        }

        async function thucHienCheckOut(maCC) {
            try {
                const res = await fetch(`/api/cham-cong/check-out/${maCC}`, { method: 'POST' });
                if (res.ok) {
                    showToast("Check-out thành công!", true);
                    loadLichSuChamCong();
                }
            } catch (e) {
                showToast("Lỗi kết nối máy chủ backend!", false);
            }
        }

        function moModalThemNV() {
            document.getElementById('nvHoTen').value = '';
            document.getElementById('nvSDT').value = '';
            document.getElementById('nvUser').value = '';
            modalThemNVInstance.show();
        }

        async function luuNhanVien() {
            const hoTen = document.getElementById('nvHoTen').value.trim();
            const soDienThoai = document.getElementById('nvSDT').value.trim();
            const tenDangNhap = document.getElementById('nvUser').value.trim();
            const matKhau = document.getElementById('nvPass').value;
            const vaiTro = document.getElementById('nvVaiTro').value;

            if (!hoTen || !tenDangNhap) {
                showToast("Vui lòng điền đầy đủ họ tên và tên đăng nhập!", false);
                return;
            }

            try {
                const res = await fetch('/api/nhan-su/nhan-vien', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hoTen, soDienThoai, tenDangNhap, matKhau, vaiTro, trangThai: 'DANG_LAM' })
                });

                if (res.ok) {
                    modalThemNVInstance.hide();
                    showToast("Thêm nhân viên thành công!", true);
                    loadNhanVien();
                } else {
                    showToast("Lỗi: Tên đăng nhập có thể đã bị trùng!", false);
                }
            } catch (e) {
                showToast("Lỗi kết nối backend!", false);
            }
        }

        async function xoaNhanVien(id) {
            if (!confirm(`Bạn có chắc chắn muốn xóa nhân viên #${id}?`)) return;
            try {
                const res = await fetch(`/api/nhan-su/nhan-vien/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    showToast("Đã xóa nhân viên!", true);
                    loadNhanVien();
                }
            } catch (e) {
                showToast("Lỗi kết nối backend!", false);
            }
        }

        function showToast(msg, isSuccess = true) {
            const toastEl = document.getElementById('liveToast');
            const msgEl = document.getElementById('toastMessage');
            if (!toastEl || !msgEl) {
                console.log(msg);
                return;
            }
            toastEl.className = 'toast align-items-center text-white border-0 shadow ' + (isSuccess ? 'bg-success' : 'bg-danger');
            msgEl.textContent = msg;
            const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
            toast.show();
        }

        async function thucHienDangXuat() {
            try {
                await fetch('/api/auth/logout', { method: 'POST' });
            } catch (e) {}
            localStorage.removeItem('currentUser');
            sessionStorage.clear();
            location.href = 'index.html';
        }
    </script>

    <!-- Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1100">
        <div id="liveToast" class="toast align-items-center text-white border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body fs-6" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</body>
</html>
